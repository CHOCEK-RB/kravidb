<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kravidb — Motor de base de datos en C++23">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- puntos decorativos -->
  <g fill="#1E3A5F" opacity="0.5">
    <circle cx="90" cy="60" r="2.5"/><circle cx="150" cy="60" r="2.5"/><circle cx="210" cy="60" r="2.5"/>
    <circle cx="1140" cy="280" r="2.5"/><circle cx="1080" cy="280" r="2.5"/><circle cx="1020" cy="280" r="2.5"/>
    <circle cx="1140" cy="60" r="2.5"/><circle cx="1080" cy="60" r="2.5"/>
    <circle cx="90" cy="280" r="2.5"/><circle cx="150" cy="280" r="2.5"/>
  </g>

  <!-- icono base de datos -->
  <g transform="translate(150,170)" filter="url(#glow)">
    <ellipse cx="0" cy="-48" rx="62" ry="22" fill="url(#disk)"/>
    <path d="M -62 -48 L -62 48 A 62 22 0 0 0 62 48 L 62 -48" fill="none" stroke="url(#disk)" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="62" ry="22" fill="none" stroke="url(#disk)" stroke-width="7" opacity="0.75"/>
    <ellipse cx="0" cy="48" rx="62" ry="22" fill="none" stroke="url(#disk)" stroke-width="7" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="268" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    <tspan fill="url(#accent)">kravi</tspan><tspan fill="#F8FAFC">db</tspan>
  </text>

  <!-- linea de acento -->
  <rect x="272" y="190" width="150" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="272" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#94A3B8">
    Motor de base de datos construido desde cero en C++23
  </text>

  <!-- chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(272,266)">
      <rect x="0" y="0" width="128" height="40" rx="20" fill="#0F2942" stroke="#1E3A5F"/>
      <text x="64" y="26" text-anchor="middle" fill="#7DD3FC">C++23 modules</text>
    </g>
    <g transform="translate(416,266)">
      <rect x="0" y="0" width="82" height="40" rx="20" fill="#0F2942" stroke="#1E3A5F"/>
      <text x="41" y="26" text-anchor="middle" fill="#7DD3FC">xmake</text>
    </g>
    <g transform="translate(514,266)">
      <rect x="0" y="0" width="86" height="40" rx="20" fill="#0F2942" stroke="#1E3A5F"/>
      <text x="43" y="26" text-anchor="middle" fill="#7DD3FC">Clang 18</text>
    </g>
  </g>
</svg>
