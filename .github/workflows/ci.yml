name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    name: Build & Test (C++23)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 18, Tools & libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 libc++-18-dev libc++abi-18-dev clang-format clang-tidy
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo ln -sf /usr/lib/llvm-18/bin/clang-scan-deps /usr/bin/clang-scan-deps

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check code formatting
        run: |
          find src tests -name "*.cpp" -o -name "*.cppm" | xargs -r clang-format --dry-run --Werror

      - name: Configure and build (Debug mode with ASan)
        run: |
          xmake f -c -m debug --toolchain=clang --sdk=/usr/lib/llvm-18 --runtimes=c++_shared
          xmake -v

      - name: Run clang-tidy
        run: |
          find src -name "*.cpp" -o -name "*.cppm" | xargs -r clang-tidy -p .

      - name: Run binary
        run: |
          xmake run kravidb

      - name: Configure and build (Release mode)
        run: |
          xmake f -c -m release --toolchain=clang --sdk=/usr/lib/llvm-18 --runtimes=c++_shared
          xmake -v
