name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    name: Build & Test (C++23)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Clang 22, Tools & libc++
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22 clang-tidy-22 clang-tools-22 libc++-22-dev libc++abi-22-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --set clang /usr/bin/clang-22
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --set clang++ /usr/bin/clang++-22
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-22
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100
          sudo update-alternatives --set clang-tidy /usr/bin/clang-tidy-22
          sudo ln -sf /usr/lib/llvm-22/bin/clang-scan-deps /usr/bin/clang-scan-deps

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages (gtest, benchmark)
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-

      - name: Configure and build (Debug mode with ASan)
        run: |
          xmake f -y -c -m debug --toolchain=clang --sdk=/usr/lib/llvm-22 --runtimes=c++_shared --ldflags=-lc++abi
          xmake -v

      - name: Determine lint scope (changed sources in PRs)
        id: changed
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=d "$base...HEAD" \
              -- ':(glob)src/**/*.cpp' ':(glob)src/**/*.cppm' \
                 ':(glob)apps/**/*.cpp' ':(glob)apps/**/*.cppm' \
                 ':(glob)tests/**/*.cpp' ':(glob)tests/**/*.cppm' | paste -sd' ' -)
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Lint scope: ${files:-(all sources)}"

      - name: Lint (format + clang-tidy)
        env:
          KRAVIDB_LINT_FILES: ${{ steps.changed.outputs.files }}
        run: xmake lint

      - name: Run binary
        run: |
          xmake run kravidb

      - name: Run unit tests (Debug, ASan + UBSan)
        run: xmake test

      - name: HTTP API smoke test
        run: |
          set -euo pipefail
          xmake build kravidb_api
          port=18080
          KRAVIDB_DEGREE=4 KRAVIDB_BIND=127.0.0.1 \
            ./build/linux/x86_64/debug/kravidb_api "$port" > /tmp/kravidb_api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:$port/api/v1/health" > /dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/kravidb_api.log
            exit 1
          fi

          test "$(curl -fsS "http://127.0.0.1:$port/api/v1/health")" = '{"status":"ok"}'
          test "$(curl -fsS "http://127.0.0.1:$port/api/v1/config")" = '{"degree":4,"page_size":4096}'

          insert=$(curl -fsS -X POST "http://127.0.0.1:$port/api/v1/btree/insert" \
            -d '{"key":42,"payload":"demo"}')
          echo "insert: $insert"
          curl -fsS "http://127.0.0.1:$port/api/v1/btree/search?key=42" | grep -q '"found":true'

          duplicate=$(curl -sS -o /tmp/duplicate.json -w '%{http_code}' -X POST \
            "http://127.0.0.1:$port/api/v1/btree/insert" -d '{"key":42,"payload":"otro"}')
          test "$duplicate" = "409"

          malformed=$(curl -sS -o /tmp/malformed.json -w '%{http_code}' -X POST \
            "http://127.0.0.1:$port/api/v1/btree/insert" -d '{"key":12abc,"payload":"x"}')
          test "$malformed" = "400"

          nested=$(curl -sS -o /tmp/nested.json -w '%{http_code}' -X POST \
            "http://127.0.0.1:$port/api/v1/btree/insert" -d '{"payload":"\"key\":99"}')
          test "$nested" = "400"

          curl -fsS "http://127.0.0.1:$port/api/v1/page/1" | grep -q '"page_id":1'
          missing_page=$(curl -sS -o /tmp/missing_page.json -w '%{http_code}' \
            "http://127.0.0.1:$port/api/v1/page/999")
          test "$missing_page" = "404"

          test "$(curl -fsS -X POST "http://127.0.0.1:$port/api/v1/reset")" = '{"status":"ok"}'

      - name: Configure and build (Release mode)
        run: |
          xmake f -y -c -m release --toolchain=clang --sdk=/usr/lib/llvm-22 --runtimes=c++_shared --ldflags=-lc++abi
          xmake -v

      - name: Run unit tests (Release)
        run: xmake test
